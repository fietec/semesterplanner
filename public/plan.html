<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester & ECTS Planner</title>
    <link rel="stylesheet" type="text/css" href="/public/style.css">
  </head>
  <body>

    <aside class="sidebar">
      <h2>Modules</h2>
      
      <form class="add-module-form" id="module-form">
        <input type="text" id="m-name" placeholder="Module Name" required>
        <input type="number" id="m-ects" placeholder="ECTS (e.g. 6)" min="1" max="30" required>
        <select id="m-color">
          <option value="bg-orange">Orange</option>
          <option value="bg-brown">Brown</option>
          <option value="bg-yellow">Yellow</option>
          <option value="bg-blue">Blue</option>
          <option value="bg-darkred">Dark Red</option>
		  <option value="bg-green">Green</option>
		  <option value="bg-gray">Gray</option>
          <option value="bg-purple">Purple</option>
          <option value="bg-pink">Pink</option>
          <option value="bg-teal">Teal</option>
          <option value="bg-indigo">Indigo</option>
          <option value="bg-cyan">Cyan</option>
        </select>
        <button type="submit" class="btn-primary">+ Add Module</button>
      </form>

      <div class="pool-dropzone dropzone" id="pool"></div>
      <div style="margin-top: auto; padding-top: 16px; text-align: center;">
        <a href="https://codeberg.org/fietec/semesterplanner" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; font-size: 0.85rem; opacity: 0.8;">
          <img src="https://codeberg.org/attachments/d915bf35-25ee-4a13-9597-f474a4b6c224" alt="Codeberg logo" style="width: 18px; height: 18px;">
          View Source Code
        </a>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-controls">
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="grand-total" style="font-weight: bold; font-size: 1rem; margin-right: 10px;">Total ECTS: 0</span>
          <button class="btn-primary" onclick="addSemester()">+ Add Semester</button>
          <button class="btn-primary" style="background: #16a34a;" onclick="savePlan()">💾 Save Data</button>
          <button class="btn-secondary" onclick="importPlan()">📥 Import Data</button>
          <button class="btn-secondary" onclick="exportPlan()">📤 Export Data</button>
          <button class="btn-very-danger" onclick="deletePlan()">❌ Delete Plan</button>
        </div>
      </div>

      <div id="semesters-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </main>

    <script>
      const pool = document.getElementById('pool');
      const semestersContainer = document.getElementById('semesters-container');

      function init() {
          makeDropzone(pool);
          loadPlan();
      }

      // GET request to fetch data from backend
      async function loadPlan() {
          try {
              const res = await fetch('', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ 'action': 'load' }),
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              
              const data = await res.json();
              if (data['success']){
                  renderPlanFromJSON(data['data']);
              } else{
                  renderDefaultLayout();
              }
          } catch (err) {
              console.warn('Backend fetch failed or not active. Falling back to default layout:', err.message);
              renderDefaultLayout();
          }
      }

      function importPlan() {
          // Create temporary file input
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json';

          fileInput.onchange = async (event) => {
              const file = event.target.files[0];
              if (!file) return;
              try {
                  const text = await file.text();
                  const jsonData = JSON.parse(text);
                  if (confirm("Importing plan. This will overwrite the current plan. Do you want to continue?")){
                      renderPlanFromJSON(jsonData);
                  }
              } catch (error) {
                  alert('Invalid JSON file. Please check the file formatting and try again.');
                  console.error(error);
              }
          };
          fileInput.click();
      }

      function exportPlan() {
          const data = buildJson();
          const jsonString = JSON.stringify(data, null, 2);
          const blob = new Blob([jsonString], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = url;
          const pathArray = window.location.pathname.split('/');
          const planName = pathArray.filter(Boolean).pop();
          downloadLink.download = `semesterplan_${planName}.json`;
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(url);
      }

      async function deletePlan() {
          if (confirm("Do you really want to delete this plan forever (rip your studies)?")){
              try {
                  const res = await fetch('', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({
                          action: 'delete',
                      })
                  });

                  if (res.ok) {
                      alert('Plan successfully deleted!');
                  } else {
                      alert(`Failed to delete: HTTP ${res.status}`);
                  }
              } catch (err) {
                  alert(`Error connecting to backend API: ${err.message}`);
              }
              loadPlan();
          }
      }

      // Render state from received backend JSON structure
      function renderPlanFromJSON(data) {
          semestersContainer.innerHTML = '';
          pool.innerHTML = '';

          // Build Semesters
          if (data.semesters && data.semesters.length > 0) {
              data.semesters.forEach(semData => {
                  const row = createSemesterRow();
                  const dropzone = row.querySelector('.semester-dropzone');
                  
                  if (semData.modules) {
                      semData.modules.forEach(m => {
                          dropzone.appendChild(createModuleCard(m.id, m.name, m.ects, m.passed, m.color));
                      });
                  }
              });
          } else {
              renderDefaultLayout();
              return;
          }

          // Populate unassigned pool
          if (data.unassignedPool) {
              data.unassignedPool.forEach(m => {
                  pool.appendChild(createModuleCard(m.id, m.name, m.ects, false, m.color));
              });
          }

          updateECTSCounts();
      }

      function renderDefaultLayout() {
          semestersContainer.innerHTML = '';
          pool.innerHTML = '';

          for (let i = 1; i <= 6; i++) {
              createSemesterRow();
          }

          updateECTSCounts();
      }

      // Dynamic semester creation
      function createSemesterRow() {
          const row = document.createElement('div');
          row.className = 'semester-row';
          
          row.innerHTML = `
        <div class="semester-label">
          <div class="semester-header-actions">
            <span class="sem-title">Semester</span>
            <button class="btn-danger" onclick="deleteSemester(this)" title="Delete Semester">✕</button>
          </div>
          <span class="ects-badge">0 ECTS</span>
        </div>
        <div class="semester-dropzone dropzone"></div>
      `;

          semestersContainer.appendChild(row);
          makeDropzone(row.querySelector('.semester-dropzone'));
          renumberSemesters();
          return row;
      }

      function addSemester() {
          createSemesterRow();
          updateECTSCounts();
      }

      function deleteSemester(buttonElement) {
          const row = buttonElement.closest('.semester-row');
          const dropzone = row.querySelector('.semester-dropzone');
          const cards = dropzone.querySelectorAll('.module-card');
          
          cards.forEach(card => pool.appendChild(card));
          row.remove();
          
          renumberSemesters();
          updateECTSCounts();
      }

      function renumberSemesters() {
          const rows = semestersContainer.querySelectorAll('.semester-row');
          rows.forEach((row, idx) => {
              row.querySelector('.sem-title').textContent = `${idx + 1}. Semester`;
          });
      }

      // Module Card creation with individual deletion
      function createModuleCard(id, name, ects, passed, colorClass) {
          const card = document.createElement('div');
          card.className = `module-card ${colorClass}`;
          card.id = id || 'mod-' + Date.now() + Math.random().toString(36).substr(2, 4);
          card.draggable = true;
          card.dataset.name = name;
          card.dataset.ects = ects;
          card.dataset.color = colorClass;
          card.dataset.passed = passed? 'true' : 'false';

          card.innerHTML = `
            <label class="card-pass-toggle">
              <input type="checkbox" ${passed ? 'checked' : ''} onclick="setModulePassed(event, this)">
              <span class="card-pass-label">✓</span>
            </label>
            <button class="card-delete-btn" onclick="deleteModuleCard(event, this)" title="Delete Module">✕</button>
            <div>${name}</div>
            <div style="font-size:0.75rem; opacity:0.9;">(${ects})</div>
          `;

          card.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/plain', card.id);
              card.classList.add('dragging');
          });

          card.addEventListener('dragend', () => {
              card.classList.remove('dragging');
          });

          return card;
      }

      // Delete single module card handler
      function deleteModuleCard(event, btnElement) {
          event.stopPropagation(); // Prevent drag initialization when clicking delete
          const card = btnElement.closest('.module-card');
          card.remove();
          updateECTSCounts();
      }

      function setModulePassed(event, toggle){
          const card = toggle.closest('.module-card');
          const passed = card.dataset.passed === 'true';
          card.dataset.passed = passed? 'false' : 'true';
          updateECTSCounts();
      }

      function makeDropzone(zone) {
          zone.addEventListener('dragover', (e) => {
              e.preventDefault();
              zone.classList.add('drag-over');
          });

          zone.addEventListener('dragleave', () => {
              zone.classList.remove('drag-over');
          });

          zone.addEventListener('drop', (e) => {
              e.preventDefault();
              zone.classList.remove('drag-over');
              
              const cardId = e.dataTransfer.getData('text/plain');
              const card = document.getElementById(cardId);
              
              if (card) {
                  zone.appendChild(card);
                  updateECTSCounts();
              }
          });
      }

      function updateECTSCounts() {
          let grandTotal = 0;
          let passed = 0;
          const rows = semestersContainer.querySelectorAll('.semester-row');

          rows.forEach(row => {
              const cards = row.querySelectorAll('.module-card');
              let semTotal = 0;
              cards.forEach(card => {
                  let ects = parseInt(card.dataset.ects, 10) || 0;
                  semTotal += ects;
                  if (card.dataset.passed === 'true') passed += ects;
              });
              row.querySelector('.ects-badge').textContent = `${semTotal} ECTS`;
              grandTotal += semTotal;
          });

          document.getElementById('grand-total').textContent = `Total ECTS: ${passed} / ${grandTotal}`;
      }

      function buildJson(){
          const rows = semestersContainer.querySelectorAll('.semester-row');
          const data = {
              timestamp: new Date().toISOString(),
              semesters: [],
              unassignedPool: []
          };

          rows.forEach((row, idx) => {
              const semesterData = {
                  semesterNumber: idx + 1,
                  modules: []
              };

              row.querySelectorAll('.module-card').forEach(card => {
                  semesterData.modules.push({
                      id: card.id,
                      name: card.dataset.name,
                      ects: parseInt(card.dataset.ects, 10),
                      passed: card.dataset.passed === 'true',
                      color: card.dataset.color
                  });
              });

              data.semesters.push(semesterData);
          });

          pool.querySelectorAll('.module-card').forEach(card => {
              data.unassignedPool.push({
                  id: card.id,
                  name: card.dataset.name,
                  ects: parseInt(card.dataset.ects, 10),
                  passed: false,
                  color: card.dataset.color
              });
          });
          return data;
      }
      
      // POST request to save data
      async function savePlan() {
          const payload = buildJson();
          try {
              const res = await fetch('', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({
                      action: 'save',
                      data: payload,
                  })
              });

              if (res.ok) {
                  alert('Plan saved successfully!');
              } else {
                  alert(`Failed to save: HTTP ${res.status}`);
              }
          } catch (err) {
              alert(`Error connecting to backend API: ${err.message}`);
          }
      }

      document.getElementById('module-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const nameInput = document.getElementById('m-name');
          const ectsInput = document.getElementById('m-ects');
          const colorInput = document.getElementById('m-color');

          const card = createModuleCard(
              null,
              nameInput.value,
              parseInt(ectsInput.value, 10),
              false,
              colorInput.value
          );

          pool.appendChild(card);
          nameInput.value = '';
          ectsInput.value = '';
      });

      init();
    </script>
  </body>
</html>
